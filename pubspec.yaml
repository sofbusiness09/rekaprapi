name: rekap_rapi
description: RekapRapi - pencatatan kas dan utang piutang untuk usaha kecil.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.3
  google_fonts: ^6.2.1
  excel: ^4.0.6
  file_saver: ^0.2.14
  fl_chart: ^1.3.0
  shared_preferences: ^2.5.6
  http: ^1.6.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/backup_apps_script.gs
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B3220"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0B3220"
    theme_color: "#0B3220"
